[project]
name = "shifde-hosted"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["shifde-core", "shifde-databricks", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3"]

[project.scripts]
shifde-admin = "shifde_hosted.admin:main"

[project.optional-dependencies]
azure = ["azure-identity>=1.19,<2", "azure-keyvault-secrets>=4.9,<5", "azure-storage-blob>=12.24,<13"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shifde_hosted"]
