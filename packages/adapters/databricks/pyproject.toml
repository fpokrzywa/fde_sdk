[project]
name = "shifde-databricks"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["shifde-core", "databricks-sdk==0.163.0", "httpx>=0.28,<1", "PyYAML>=6,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shifde_databricks"]
