# Local dependency services only. The API and workers run from the uv workspace.
services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_PASSWORD: shifde-development-only
      POSTGRES_DB: shifde
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shifde"]
      interval: 3s
      timeout: 3s
      retries: 20
  temporal:
    image: temporalio/temporal:1.10.0
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal:/data
volumes:
  postgres:
  temporal:
