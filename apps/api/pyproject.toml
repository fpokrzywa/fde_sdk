[project]
name = "shifde-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["shifde-hosted", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
shifde-api = "shifde_api.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shifde_api"]
