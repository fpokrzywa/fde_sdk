[project]
name = "shifde-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["shifde-api", "mcp>=2,<3"]

[project.scripts]
shifde-mcp = "shifde_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shifde_mcp"]
