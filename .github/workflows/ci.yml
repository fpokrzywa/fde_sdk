name: SDK and hosted delivery
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    steps:
      - name: Confirm matrix and runner startup
        shell: bash
        run: printf '%s\n' 'matrix-startup-probe-ok'
