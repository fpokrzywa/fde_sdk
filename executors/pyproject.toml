[project]
name = "shifde-executor"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["shifde-databricks", "shifde-snowflake", "shifde-fabric", "azure-identity>=1.19,<2", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
azure = ["azure-identity>=1.19,<2", "azure-keyvault-secrets>=4.9,<5"]

[project.scripts]
shifde-executor = "shifde_executor.supervisor:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shifde_executor"]
