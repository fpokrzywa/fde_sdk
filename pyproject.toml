[project]
name = "shifde-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["shifde-contracts", "shifde-core", "shifde-databricks", "shifde-sdk", "shifde-hosted", "shifde-api", "shifde-control-worker", "shifde-mcp", "shifde-executor"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "jsonschema>=4.23,<5", "types-PyYAML>=6,<7", "regex>=2024,<2027", "Flask==3.1.3"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contracts", "packages/core", "packages/adapters/databricks", "packages/adapters/snowflake", "packages/adapters/fabric", "packages/sdk_python", "packages/hosted", "apps/api", "apps/control_worker", "apps/mcp", "executors"]

[tool.uv.sources]
shifde-contracts = { workspace = true }
shifde-core = { workspace = true }
shifde-databricks = { workspace = true }
shifde-snowflake = { workspace = true }
shifde-fabric = { workspace = true }
shifde-sdk = { workspace = true }
shifde-hosted = { workspace = true }
shifde-api = { workspace = true }
shifde-control-worker = { workspace = true }
shifde-mcp = { workspace = true }
shifde-executor = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: requires an explicitly configured native development account", "integration: requires local PostgreSQL or Temporal", "container: requires a digest-pinned built executor Docker image"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ["packages/contracts/src", "packages/core/src", "packages/adapters/databricks/src", "packages/adapters/snowflake/src", "packages/adapters/fabric/src", "packages/sdk_python/src", "packages/hosted/src", "apps/api/src", "apps/control_worker/src", "apps/mcp/src", "executors/src"]
